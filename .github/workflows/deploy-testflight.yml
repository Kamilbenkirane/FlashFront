name: Deploy TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-ios
  queue: max

permissions:
  contents: read

jobs:
  ios:
    name: iOS TestFlight
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check release credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
        run: |
          : "${EXPO_TOKEN:?Set the EXPO_TOKEN repository secret}"
          : "${FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD:?Set the FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD repository secret}"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --global eas-cli@18.6.0
          gem install fastlane cocoapods --no-document

      - name: Typecheck
        run: node_modules/.bin/tsc --noEmit

      - name: Build iOS on this runner
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NODE_ENV: production
        run: |
          eas build \
            --platform ios \
            --profile production \
            --local \
            --output "$RUNNER_TEMP/flashfront.ipa" \
            --non-interactive

      - name: Upload to TestFlight
        env:
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
        run: |
          fastlane pilot upload \
            --ipa "$RUNNER_TEMP/flashfront.ipa" \
            --apple_id "$(jq -er '.submit.production.ios.ascAppId' eas.json)" \
            --username "$(jq -er '.submit.production.ios.appleId' eas.json)" \
            --team_id "$(jq -er '.submit.production.ios.appleTeamId' eas.json)" \
            --skip_waiting_for_build_processing true
