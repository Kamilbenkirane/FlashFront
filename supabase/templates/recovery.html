<h2>Reset your FlashFront password</h2>
<p>Open this email on the device running FlashFront. For local development, open the link inside your iOS simulator.</p>
<p><a href="{{ if or (eq .RedirectTo "flashfront://auth/recovery") (eq .RedirectTo "flashfront:///auth/recovery") }}flashfront://auth/recovery?token_hash={{ .TokenHash }}&amp;type=recovery{{ else if eq .RedirectTo "exp://127.0.0.1:8081/--/auth/recovery" }}exp://127.0.0.1:8081/--/auth/recovery?token_hash={{ .TokenHash }}&amp;type=recovery{{ else if eq .RedirectTo "exp://localhost:8081/--/auth/recovery" }}exp://localhost:8081/--/auth/recovery?token_hash={{ .TokenHash }}&amp;type=recovery{{ else }}{{ .ConfirmationURL }}{{ end }}">Reset password</a></p>
<p>If you did not request this, you can ignore this email.</p>
