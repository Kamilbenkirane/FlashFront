<h2>Confirm your FlashFront account</h2>
<p>Open this email on the device running FlashFront. For local development, open the link inside your iOS simulator.</p>
<p><a href="{{ if or (eq .RedirectTo "flashfront://auth/callback") (eq .RedirectTo "flashfront:///auth/callback") }}flashfront://auth/callback?token_hash={{ .TokenHash }}&amp;type=signup{{ else if eq .RedirectTo "exp://127.0.0.1:8081/--/auth/callback" }}exp://127.0.0.1:8081/--/auth/callback?token_hash={{ .TokenHash }}&amp;type=signup{{ else if eq .RedirectTo "exp://localhost:8081/--/auth/callback" }}exp://localhost:8081/--/auth/callback?token_hash={{ .TokenHash }}&amp;type=signup{{ else }}{{ .ConfirmationURL }}{{ end }}">Confirm email</a></p>
<p>If you did not request this, you can ignore this email.</p>
